<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Argus-paper-reader Geometric Logo">
  <defs>
    <!-- Deep Editorial Navy Badge Gradient -->
    <radialGradient id="navyBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1b2f4f" />
      <stop offset="65%" stop-color="#0f1e36" />
      <stop offset="100%" stop-color="#08101d" />
    </radialGradient>

    <!-- Radiant Shimmering Gold Gradient -->
    <linearGradient id="goldRadiant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#e5b84b" />
      <stop offset="100%" stop-color="#b47d17" />
    </linearGradient>

    <!-- Subtle Vertical Gold Glow for Inner Iris -->
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c59b27" stop-opacity="0.75" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#navyBg)" stroke="url(#goldRadiant)" stroke-width="2" />

  <!-- Inner Hairline Architectural Frame -->
  <rect x="10.5" y="10.5" width="99" height="99" rx="20" fill="none" stroke="#c59b27" stroke-opacity="0.28" stroke-width="0.9" />

  <!-- Panoptes Orbital Constellation Arcs (Hundred-Eyed Lattice) -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="#c59b27" stroke-opacity="0.22" stroke-width="0.85" stroke-dasharray="2.5 3.5" />
  <circle cx="60" cy="60" r="31.5" fill="none" stroke="#e5b84b" stroke-opacity="0.18" stroke-width="0.75" />

  <!-- Cardinal Axis Precision Ticks -->
  <line x1="60" y1="15" x2="60" y2="23" stroke="url(#goldRadiant)" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
  <line x1="60" y1="97" x2="60" y2="105" stroke="url(#goldRadiant)" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
  <line x1="15" y1="60" x2="21" y2="60" stroke="#c59b27" stroke-width="1.1" stroke-linecap="round" opacity="0.55" />
  <line x1="99" y1="60" x2="105" y2="60" stroke="#c59b27" stroke-width="1.1" stroke-linecap="round" opacity="0.55" />

  <!-- Five-Lens Constellation Nodes (Upper & Lower Panoptes Watch-Eyes) -->
  <!-- Thesis Gold, Concept Crimson, Evidence Azure, Rebuttal Emerald, Method Violet (muted jewel tones on navy) -->
  <g opacity="0.92">
    <circle cx="33" cy="31" r="2.2" fill="#f59e0b" />
    <circle cx="46" cy="23.5" r="2.2" fill="#fb7185" />
    <circle cx="60" cy="21" r="2.6" fill="#fef08a" filter="url(#goldGlow)" />
    <circle cx="74" cy="23.5" r="2.2" fill="#38bdf8" />
    <circle cx="87" cy="31" r="2.2" fill="#a78bfa" />

    <!-- Symmetric Lower Watch Nodes -->
    <circle cx="38" cy="91" r="1.7" fill="#c59b27" opacity="0.6" />
    <circle cx="60" cy="96" r="2" fill="#34d399" opacity="0.85" />
    <circle cx="82" cy="91" r="1.7" fill="#c59b27" opacity="0.6" />
  </g>

  <!-- Central Argus Panoptes Geometric Eye -->
  <g filter="url(#goldGlow)">
    <!-- Outer Almond Eye Contour -->
    <path d="M 21 60 Q 60 28 99 60 Q 60 92 21 60 Z"
          fill="#0b1526"
          stroke="url(#goldRadiant)"
          stroke-width="2.6"
          stroke-linejoin="round" />

    <!-- Inner Split-Column Reference Ring (Dual-Column Grid Metaphor) -->
    <path d="M 28.5 60 Q 60 35.5 91.5 60 Q 60 84.5 28.5 60 Z"
          fill="none"
          stroke="#e5b84b"
          stroke-opacity="0.4"
          stroke-width="0.9" />
  </g>

  <!-- Dual-Column Architectural Pillars Inside Sclera -->
  <line x1="42" y1="53" x2="42" y2="67" stroke="#c59b27" stroke-opacity="0.35" stroke-width="1" />
  <line x1="78" y1="53" x2="78" y2="67" stroke="#c59b27" stroke-opacity="0.35" stroke-width="1" />

  <!-- Outer Golden Iris Circle -->
  <circle cx="60" cy="60" r="15.5" fill="#132642" stroke="url(#goldRadiant)" stroke-width="2.2" />

  <!-- Octagonal Faceted Lens Geometry inside Iris -->
  <polygon points="60,47 69.2,50.8 73,60 69.2,69.2 60,73 50.8,69.2 47,60 50.8,50.8"
           fill="none"
           stroke="#fde68a"
           stroke-opacity="0.45"
           stroke-width="0.85" />

  <!-- Deep Pupil Core -->
  <circle cx="60" cy="60" r="7.8" fill="#08101d" stroke="url(#goldSoft)" stroke-width="1.4" />

  <!-- Four-Point Analytical Star / Logic Aperture -->
  <path d="M 60 52.8 L 61.8 58.2 L 67.2 60 L 61.8 61.8 L 60 67.2 L 58.2 61.8 L 52.8 60 L 58.2 58.2 Z"
        fill="url(#goldRadiant)" />

  <!-- Crisp Specular Glint -->
  <circle cx="64.5" cy="54.8" r="1.4" fill="#fffbeb" opacity="0.9" />
</svg>
